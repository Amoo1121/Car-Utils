services:
  car-utils-server:
    build:
      context: ./server
    container_name: car-utils-server
    restart: unless-stopped
    environment:
      PORT: "${CAR_UTILS_API_INTERNAL_PORT:-3001}"
      HOST: "0.0.0.0"
      CAR_UTILS_DB_PATH: /app/data/car-utils.sqlite
      CORS_ORIGIN: "http://localhost:${CAR_UTILS_WEB_PORT:-5173}"
      AUTH_SESSION_DAYS: "${AUTH_SESSION_DAYS:-30}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_PASSWORD_PEPPER: "${AUTH_PASSWORD_PEPPER:-}"
    ports:
      - "${CAR_UTILS_API_PORT:-3001}:${CAR_UTILS_API_INTERNAL_PORT:-3001}"
    volumes:
      - car-utils-sqlite:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  car-utils-web:
    profiles:
      - desktop
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: car-utils-web
    restart: unless-stopped
    environment:
      CAR_UTILS_API_INTERNAL_PORT: "${CAR_UTILS_API_INTERNAL_PORT:-3001}"
    depends_on:
      car-utils-server:
        condition: service_healthy
    ports:
      - "${CAR_UTILS_APP_PORT:-4173}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1/ && wget --quiet --tries=1 -O /dev/null http://127.0.0.1/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  car-utils-sqlite:
